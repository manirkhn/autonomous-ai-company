services:
  - type: web
    name: autonomous-ai-company
    env: docker
    plan: free
    region: frankfurt # or oregon
    healthCheckPath: /health
    # Note: On Render, persistent disks require a paid Starter plan ($7/mo).
    # For 100% Free plan deployment ($0.00), disk is commented out.
    # disk:
    #   name: company-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: REPORT_RECIPIENT
        value: manirkhn@gmail.com
      - key: REPORT_TIMEZONE
        value: Asia/Dubai
      # Own WhatsApp line (Meta Cloud API). Set the secret values in the Render dashboard.
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_OWNER_NUMBERS
        sync: false
      - key: WA_ALLOWED_NUMBERS
        sync: false
      - key: WA_PERSONA
        value: saira_procurement
      - key: WA_AUTOREPLY
        value: "on"
