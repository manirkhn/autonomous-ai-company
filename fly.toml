app = "autonomous-ai-company"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  REPORT_RECIPIENT = "manirkhn@gmail.com"
  REPORT_TIMEZONE = "Asia/Dubai"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.heartbeat]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/api/cloud/heartbeat"

[[mounts]]
  source = "company_data"
  destination = "/app/data"
